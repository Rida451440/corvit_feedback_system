<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Corvit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="top-header">
    <div class="header-content">
        <a href="{{ url_for('home') }}" class="brand" aria-label="Corvit home">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Corvit" class="brand-logo">
            <span class="brand-text">Student Feedback System</span>
        </a>

        <div class="header-text">Student Portal</div>
    </div>
</header>

<main class="login-container">
    <div class="login-card">

        <div class="login-icon">✓</div>

        <h1>Thank You!</h1>

        <p class="login-description">
            Your feedback has been submitted successfully.
        </p>

        <p class="privacy-note">
            Thank you for helping Corvit Institute of Information Technology
            improve its courses, facilities and services.
        </p>

        <a href="{{ url_for('student_login') }}" class="continue-button">
            Submit Another Feedback
        </a>

    </div>
</main>

<footer>
    © 2026 Corvit Institute of Information Technology
</footer>

</body>
</html>
